
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StockAudit Pro - OTP Test</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>
<body style="font-family:Arial,sans-serif;max-width:420px;margin:40px auto;padding:20px">
  <h2>StockAudit Pro</h2>
  <h3>Mobile OTP Login Test</h3>
  <label>Mobile Number (India)</label>
  <input id="phone" type="tel" placeholder="+919876543210" style="width:100%;padding:12px;box-sizing:border-box;margin:10px 0">
  <div id="recaptcha-container"></div>
  <button onclick="sendOTP()">Send OTP</button>
  <hr>
  <label>Enter OTP</label>
  <input id="otp" type="number" placeholder="6-digit OTP" style="width:100%;padding:12px;box-sizing:border-box;margin:10px 0">
  <button onclick="verifyOTP()">Verify OTP</button>
  <p id="msg"></p>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDEF8VWUbg_8Rj7QR2RcrgQDGqTC0ODxzU",
  authDomain: "stockaudit-pro-7677e.firebaseapp.com",
  projectId: "stockaudit-pro-7677e",
  storageBucket: "stockaudit-pro-7677e.firebasestorage.app",
  messagingSenderId: "629314131631",
  appId: "1:629314131631:web:9ed0b7d10c349a2b0c665a",
  measurementId: "G-JWZQR34RS6"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
let confirmationResult;

window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier(
  'recaptcha-container',
  { size: 'normal' }
);

recaptchaVerifier.render().catch(e => {
  document.getElementById('msg').textContent = e.message;
});

async function sendOTP() {
  const phone = document.getElementById('phone').value.trim();
  const msg = document.getElementById('msg');
  try {
    if (!phone.startsWith('+')) {
      msg.textContent = 'Number country code ke saath likhein, jaise +91...';
      return;
    }
    confirmationResult = await auth.signInWithPhoneNumber(
      phone, window.recaptchaVerifier
    );
    msg.textContent = 'OTP sent. SMS check karein.';
  } catch (e) {
    msg.textContent = 'Error: ' + e.message;
    if (window.recaptchaVerifier) {
      window.recaptchaVerifier.clear();
    }
  }
}

async function verifyOTP() {
  const code = document.getElementById('otp').value.trim();
  try {
    if (!confirmationResult) {
      document.getElementById('msg').textContent = 'Pehle Send OTP dabayein.';
      return;
    }
    await confirmationResult.confirm(code);
    document.getElementById('msg').textContent = 'OTP verified successfully!';
  } catch (e) {
    document.getElementById('msg').textContent = 'Error: ' + e.message;
  }
}
</script>
</body>
</html>
